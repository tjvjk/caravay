[project]
name = "caraway"
version = "0.2.0"
description = "Offline Source Armenian language processing CLI"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "huggingface-hub>=1.30,<2",
    "pydantic-settings>=2.11,<3",
    "torch==2.14.0",
    "transformers==5.16.1",
]

[project.scripts]
caraway = "caraway.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-randomly>=4.0.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "--disable-warnings --timeout=10"
log_cli = false

[tool.ruff]
line-length = 88
exclude = ["prototypes"]

[tool.ruff.lint]
select = ["A", "ANN", "B", "C4", "E", "F", "I", "N", "RUF", "SIM", "UP", "W"]

[tool.mypy]
strict = true
packages = ["caraway"]
